<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log workout — FitNexx</title>
<meta name="description" content="Log a set and see it added to your FitNexx history.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
  <aside class="app-sidebar">
    <div class="app-logo-row">
      <a href="app-dashboard.html" class="logo">FIT<span>NEXX</span></a>
    </div>
    <ul class="app-nav">
      <li><a href="app-dashboard.html">Dashboard</a></li>
      <li><a href="app-log.html" class="active">Log workout</a></li>
      <li><a href="app-progress.html">Progress</a></li>
      <li><a href="app-programs.html">Programs</a></li>
      <li><a href="app-calculator.html">Calculator</a></li>
    </ul>
    <a href="index.html" class="app-back">← Back to site</a>
  </aside>
    <main class="app-main">
      <div class="app-view-head">
        <div>
          <h2>Log a workout</h2>
          <p>Add a set as soon as you finish it — the dashboard and progress charts update right away.</p>
        </div>
      </div>

      <form class="log-form" id="log-form">
        <div class="field">
          <label for="log-lift">Lift</label>
          <select id="log-lift">
            <option>Back squat</option>
            <option>Bench press</option>
            <option>Deadlift</option>
            <option>Overhead press</option>
          </select>
        </div>
        <div class="field">
          <label for="log-weight">Weight (kg)</label>
          <input type="number" id="log-weight" min="0" step="0.5" placeholder="e.g. 80" required>
        </div>
        <div class="field">
          <label for="log-reps">Reps</label>
          <input type="number" id="log-reps" min="1" max="20" step="1" placeholder="e.g. 5" required>
        </div>
        <div class="field">
          <label for="log-date">Date</label>
          <input type="date" id="log-date" required>
        </div>
        <button type="submit" class="log-add-btn">Add set</button>
      </form>

      <div class="panel" style="padding:0;overflow-x:auto;">
        <div style="padding:24px 24px 0 24px;">
          <h3>Logged sets</h3>
        </div>
        <div style="padding:0 24px 24px 24px;">
          <div id="log-table-wrap"></div>
        </div>
      </div>
    </main>
  </div>
<script src="app.js"></script>
</body>
</html>
